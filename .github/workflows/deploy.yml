# Publishes sarle.ee. On every push to main: builds the site (public files
# only, plus /et/ and /ru/ pages), checks the build, and deploys it to
# GitHub Pages. Requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install build tools
        working-directory: tools
        run: npm ci
      - name: Build site
        working-directory: tools
        run: npm run build
      - name: Check build
        working-directory: tools
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
